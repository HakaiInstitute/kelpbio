on:
  push:
    branches: [main, dev]
  pull_request:

name: jarl-check

permissions: read-all

jobs:
  jarl-check:
    name: jarl-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: etiennebacher/setup-jarl@3da5ed84764b78284e8b9f2bc21e525ba97e8b50
      - run: jarl check .
