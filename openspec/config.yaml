schema: spec-driven

context: |
  kelpbio: an R package for Bayesian kelp biomass estimation (Hakai Institute / Poisson
  Consulting). The design docs are the source of truth and should be referenced rather
  than restated: docs/package-design.md, docs/bayesian-engine.md, docs/vertical-slice.md,
  docs/testing-strategy.md, docs/bboutools-api-review.md. Architecture follows the
  bboutools R package (S3).

  Conventions:
  - All exported functions use the kb_ prefix.
  - Bayesian engine: rstan + rstantools. Stan models live in inst/stan/ and are
    pre-compiled at R CMD INSTALL (exposed as stanmodels$<name>). NO cmdstan.
    devtools::load_all() does NOT pick up Stan changes — use devtools::install()
    (first compile is 10-20 min). Sampling: rstan::sampling(stanmodels$<name>, data=...).
  - Fit objects (kb_fit / kb_fit_<type>) store EXTRACTED posterior draws (the posterior
    package) + sampler diagnostics + data + meta — NOT the live stanfit.
  - Priors are passed as data: hyperparameters go in the Stan data block; the prior
    FAMILY is fixed at compile time. The user-facing surface is structured prior objects
    (kb_prior_normal(), kb_prior_exponential()) returned in a named list by kb_priors_*().
    A prior_only flag (and nObs >= 0) supports prior-only / prior-predictive fits.
  - Validation: every exported argument is validated with chk at entry; user-facing
    messages use cli. Enumerated args (species, family, uncertainty, by) are character
    vectors validated with rlang::arg_match(); default is the first value.
  - Predictions have two orthogonal axes: `by` (character vector of grouping factors)
    and `uncertainty = c("marginal","typical")` (marginal is the default). Summary
    functions (kb_predict_*, tidy, coef) carry sig_fig; the _samples() variants return
    full-precision draws and take no sig_fig. Everything is at site-year resolution
    (no month dimension).
  - Documentation: roxygen2 with markdown; @inheritParams donor (params.R) for shared args.
  - Code style: tidyverse; no lubridate / reshape2 / plyr / data.table; no library()
    calls in package code (use @importFrom or pkg::fun()). One function per file, named
    after the function; S3 methods grouped one file per generic.
  - Testing: testthat 3e; strict 1:1 mirroring (R/<name>.R <-> tests/testthat/test-<name>.R).
    Test the wrapper, not the model's numbers. NEVER snapshot MCMC numerics — assert
    structure + invariants; snapshot only prints and cli messages. Small pre-built fits
    live in tests/testthat/fixtures/ built with rstan::sampling(seed=) (not set.seed);
    slow end-to-end fits use skip_on_cran(). Distribution target is the Hakai R-universe
    (not CRAN); demo + coastwide data + slim pre-fit models ship in the package data/.

rules:
  proposal:
    - Keep focused; include a Non-goals section.
    - Reference the relevant design doc rather than restating its content.
  specs:
    - Express observable behavior as requirements with Given/When/Then scenarios.
    - Describe behavior (signatures, return shapes, errors), not implementation.
  design:
    - Cite the design doc(s) and capture only decisions/mechanisms not already in them.
  tasks:
    - Ground tasks in the design docs; order pure helpers before install-gated Stan steps.
    - Mark devtools::install() checkpoints (Stan changes are not picked up by load_all).
