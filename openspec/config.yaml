schema: spec-driven

context: |
  kelpbio: an R package for Bayesian kelp biomass estimation (Hakai Institute /
  Poisson Consulting), S3 architecture following the bboutools package. Models
  work at site-year resolution (no month dimension) and are adapted from the
  analysis project hakai-kelp-biomass-25.

  Homes (one fact, one home; see openspec/workflow.md):
  - openspec/specs/: observable behaviour (fitting, predictions, summaries).
  - code, tests, snapshots: the exact models, outputs, parameter and prior lists.
  - CLAUDE.md: coding, testing, and documentation conventions.
  - decisions/: rationale that outlives a change.
  - a change's design.md: rationale for that change.

rules:
  proposal:
    - Keep focused; include a Non-goals section.
    - Cite the relevant spec or decisions/ record rather than restating it.
  specs:
    - Express observable behaviour as requirements with WHEN/THEN scenarios.
    - Describe behaviour (arguments, returned values, validation, messages, errors), not implementation.
    - Do not name Stan data fields, parameter or prior lists, meta fields, internal functions, or files.
    - Where a snapshot or test pins the output, cite it instead of restating it.
    - Extend an existing general requirement before adding a case-specific one.
  design:
    - Write design.md only when there are decisions with alternatives worth recording.
    - Capture rationale specific to this change; cite decisions/ for cross-cutting decisions.
  tasks:
    - Order pure helpers before install-gated Stan steps.
    - Mark devtools::install() checkpoints (Stan changes are not picked up by load_all).
